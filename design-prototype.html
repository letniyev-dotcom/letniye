<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"><title>letnievpn</title>
<style>
/* ПРАВИЛА ДИЗАЙНА letnievpn
   1. Иконки — просто знак: без подложек, обводок и теней. Активность — только цветом.
   2. Шрифт Roboto 400/500, сетка отступов 16px.
   3. Акцент — розоватый. Им красим логотип, активные состояния, кольцо, выбранный сервер.
   4. Никаких обводок и серых полос-разделителей: формы отделяются только заливкой.
      Исключение: кнопка включения — объёмное стекло, как карточки статей в letniye.
   5. Две темы: светлая (по умолчанию) и тёмная, кнопка слева от скриншота. */
:root{--primary:#F4A6C0;--on-primary:#2A0E18;--bg:#141012;--surface:#221B1E;--island:#2C2326;--text:#F6EEF0;--text-2:#A39499;--bg-rgb:20,16,18;--tint:rgba(244,166,192,.14);--ff:Roboto,"Segoe UI",system-ui,sans-serif;--top:38px;--ga:#3A2D32;--gb:#1E1719;--rim-hi:rgba(255,255,255,.30);--rim-lo:rgba(255,255,255,.04);--gglow:rgba(255,255,255,.06);--sh:rgba(0,0,0,.55);--sh2:rgba(0,0,0,.40)}
.screen.light{--primary:#D4527F;--on-primary:#FFF;--bg:#FBF4F5;--surface:#F3E8EB;--island:#FFFDFD;--text:#25181C;--text-2:#85727A;--bg-rgb:251,244,245;--tint:rgba(212,82,127,.12);--ga:#F2E2E7;--gb:#FFFDFD;--rim-hi:rgba(255,255,255,1);--rim-lo:rgba(255,255,255,.6);--gglow:rgba(255,255,255,.8);--sh:rgba(120,60,80,.12);--sh2:rgba(120,60,80,.10)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E9E6EA;transition:none;font-family:var(--ff);font-synthesis:none;-webkit-font-smoothing:antialiased;color:#fff;display:flex;justify-content:center;align-items:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block;flex:none}
#stage{width:408px;height:887px;transform-origin:center center;flex:none}
.phone{position:relative;width:408px;height:887px;border-radius:52px;background:linear-gradient(145deg,#33383A,#0E1011 55%,#1A1D1E);padding:8px;box-shadow:0 0 0 1.5px #5E6466,0 0 0 3px #15181A,inset 0 0 0 2px #050606}
.phone::before,.phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2A2E30,#4A5052)}
.phone::before{right:-7px;top:190px;height:78px}.phone::after{left:-7px;top:150px;height:128px}
.screen{width:392px;height:871px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.status{position:absolute;top:0;left:0;right:0;height:38px;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0;font:500 15px/20px var(--ff);color:var(--text);pointer-events:none}
.status .cam{position:absolute;left:50%;top:10px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2B3342 0,#0B0D11 50%,#000 100%);box-shadow:0 0 0 2px #050606,inset 0 0 0 1.5px #1B1F27;transform:translateX(-50%)}
.status .r{display:flex;gap:5px;align-items:center}

/* шапка: логотип и заголовок вместе по центру, справа «+» */
.head{position:absolute;left:0;right:0;top:0;padding-top:var(--top);z-index:5}
.bar{height:56px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 4px}
.ib{width:48px;height:48px;display:grid;place-items:center;color:var(--primary)}
.ib svg{width:26px;height:26px;fill:currentColor}
#logs svg{fill:none}
.ib:active{opacity:.6}
.ttl{justify-self:center;display:flex;align-items:center;gap:8px}
.ttl svg{width:24px;height:24px;color:var(--primary)}
.ttl h1{font:500 20px/28px var(--ff);letter-spacing:.1px}
.fade-top{position:absolute;left:0;right:0;top:0;height:112px;z-index:4;pointer-events:none;background:linear-gradient(to bottom,rgba(var(--bg-rgb),1) 0,rgba(var(--bg-rgb),1) 60px,rgba(var(--bg-rgb),.9627) 68px,rgba(var(--bg-rgb),.8522) 76px,rgba(var(--bg-rgb),.6924) 84px,rgba(var(--bg-rgb),.5076) 92px,rgba(var(--bg-rgb),.3217) 99px,rgba(var(--bg-rgb),.1591) 105px,rgba(var(--bg-rgb),0) 112px)}

.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:94px 12px 28px}
.scroll::-webkit-scrollbar{display:none}

/* кнопка включения: объёмное стекло как карточки статей */
.pw{display:flex;flex-direction:column;align-items:center;padding:40px 0 32px}
.pwrap{position:relative;width:148px;height:148px;display:grid;place-items:center;margin-bottom:20px}
.pbtn{position:relative;width:148px;height:148px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);
 background:linear-gradient(150deg,var(--ga) 0%,var(--gb) 100%);
 box-shadow:0 10px 28px var(--sh),inset 0 0 18px var(--gglow);transition:box-shadow .5s,background .5s,color .5s,transform .2s}
.pbtn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
 background:linear-gradient(135deg,var(--rim-hi) 0%,var(--rim-lo) 38%,var(--rim-lo) 62%,var(--rim-hi) 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.pbtn svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:color .5s}
.pbtn:active{transform:scale(.97)}
.pw[data-s=con] .pbtn,.pw[data-s=on] .pbtn{color:var(--primary)}
.pw[data-s=on] .pbtn{background:linear-gradient(150deg,color-mix(in srgb,var(--primary) 26%,var(--ga)) 0%,color-mix(in srgb,var(--primary) 6%,var(--gb)) 100%);box-shadow:0 10px 30px color-mix(in srgb,var(--primary) 34%,transparent),inset 0 0 18px var(--gglow)}
/* кольцо загрузки: плавно появляется вокруг, после включения исчезает */
.ring{position:absolute;left:-4px;top:-4px;width:156px;height:156px;overflow:visible;opacity:0;transition:opacity .45s ease;pointer-events:none}
.ring circle{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-dasharray:130 348}
.ring g{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
.pw[data-s=con] .ring{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.st{font:500 18px/24px var(--ff);margin-top:4px;transition:color .4s}
.pw[data-s=on] .st{color:var(--primary)}
.sub2{font:400 14px/20px var(--ff);color:var(--text-2);margin-top:2px;min-height:20px}

/* контейнеры: только заливка */
.box{background:var(--surface);border-radius:22px}
.smart{position:relative;display:flex;align-items:center;gap:12px;padding:16px 16px 16px 18px;margin-bottom:12px;
 background:linear-gradient(150deg,var(--ga) 0%,var(--gb) 100%);
 box-shadow:0 8px 22px var(--sh2),inset 0 0 14px var(--gglow)}
.smart::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
 background:linear-gradient(135deg,var(--rim-hi) 0%,var(--rim-lo) 38%,var(--rim-lo) 62%,var(--rim-hi) 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

.smart .tx{flex:1;min-width:0}
.smart b{display:block;font:500 16px/22px var(--ff)}
.smart span{display:block;font:400 13px/18px var(--ff);color:var(--text-2);margin-top:2px}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:var(--surface);flex:none;transition:background .3s}
.sw i{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--text-2);transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s}
.sw.on{background:var(--primary)}
.sw.on i{transform:translateX(20px);background:var(--on-primary)}
.screen:not(.light) .sw.on i{background:#2A0E18}

.subs{padding:8px 0 10px}
.sh{width:100%;display:flex;align-items:center;gap:8px;padding:12px 8px 8px 18px;text-align:left}
.sh .tx{flex:1;min-width:0}
.sh b{display:block;font:500 16px/22px var(--ff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh span{display:block;font:400 13px/18px var(--ff);color:var(--text-2)}
.sh svg{width:24px;height:24px;fill:var(--text-2);margin-right:4px;transition:transform .25s}
.sg.shut .sh svg{transform:rotate(-90deg)}
.sg.shut .sv{display:none}
.sv{padding:0 0 6px}
.srv{width:100%;display:grid;grid-template-columns:34px 1fr auto 24px;align-items:center;gap:4px;padding:0 14px 0 18px;height:52px;text-align:left}
.srv .cc{font:500 12px/16px var(--ff);color:var(--text-2);letter-spacing:.4px}
.srv .nm{min-width:0}
.srv .nm b{display:block;font:500 15px/20px var(--ff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv .nm span{display:block;font:400 12px/16px var(--ff);color:var(--text-2)}
.srv .pg{font:500 13px/18px var(--ff);color:var(--text-2);font-variant-numeric:tabular-nums}
.srv.best .pg{color:var(--primary)}
.srv .ck{width:22px;height:22px;fill:var(--primary);opacity:0}
.srv.sel .nm b,.srv.sel .cc{color:var(--primary)}
.srv.sel .ck{opacity:1}
.srv:active{opacity:.7}

#shotBtn,#themeBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:100;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--pk,#D4527F);color:#fff;font:500 14px/20px var(--ff);box-shadow:0 2px 10px rgba(0,0,0,.22);touch-action:none;user-select:none;-webkit-user-select:none}
#shotBtn{right:12px}#themeBtn{left:12px}
#shotBtn svg,#themeBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#shotBtn span{display:none}
#shotBtn:active,#themeBtn:active{transform:scale(.96)}#shotBtn[disabled]{opacity:.6;cursor:progress}
body.dk{background:#0C0A0B}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
#themeBtn .moon{display:none}
body.dk #themeBtn .sun{display:none}body.dk #themeBtn .moon{display:block}
</style>
</head><body>
<svg width="0" height="0" style="position:absolute"><defs>

<div id="stage"><div class="phone"><div class="screen light" id="scr">
 <div class="status"><span>9:41</span><i class="cam"></i>
  <div class="r">

 <div class="head"><div class="bar">

 </div></div>
 <div class="fade-top"></div>

 <div class="scroll" id="scroll">
  <div class="pw" id="pw" data-s="off">
   <div class="pwrap">
    <svg class="ring" viewBox="0 0 156 156"><g><circle cx="78" cy="78" r="76"/></g></svg>
    <button class="pbtn" id="pbtn" aria-label="Включить"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 6.9a8 8 0 1 0 11.2 0"/></svg></button>
   </div>

   <button class="sw on" id="sw" aria-label="Умное подключение"><i></i></button>
  </div>

  <div class="box subs" id="subs"></div>
 </div>
</div></div></div>
<button id="themeBtn" type="button" aria-label="Сменить тему"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
<button id="shotBtn" type="button" aria-label="Скачать скриншот экрана"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg><span>Скачать скрин</span></button>

<script>
const SUBS=[
 {n:'Letnie Net',u:'12 ГБ из 50 ГБ',s:[
  {c:'FI',n:'Финляндия',l:'Хельсинки',p:24},{c:'SE',n:'Швеция',l:'Стокгольм',p:33},{c:'NL',n:'Нидерланды',l:'Амстердам',p:38},{c:'DE',n:'Германия',l:'Франкфурт',p:41},{c:'PL',n:'Польша',l:'Варшава',p:52}]},
 {n:'Reserve',u:'до 14 декабря',s:[
  {c:'TR',n:'Турция',l:'Стамбул',p:64},{c:'KZ',n:'Казахстан',l:'Алматы',p:87},{c:'US',n:'США',l:'Нью-Йорк',p:168}]}
];
const POOL=[{c:'FI',n:'Финляндия',l:'Хельсинки'},{c:'DE',n:'Германия',l:'Берлин'},{c:'NL',n:'Нидерланды',l:'Амстердам'},{c:'LV',n:'Латвия',l:'Рига'},{c:'EE',n:'Эстония',l:'Таллин'},{c:'FR',n:'Франция',l:'Париж'}];
let smart=true,sel=null,state='off',shut={};
const $=id=>document.getElementById(id);
function best(){let b=null;SUBS.forEach((g,gi)=>g.s.forEach((s,si)=>{if(!b||s.p<b.s.p)b=({s,gi,si})}));return b}
function chosen(){if(smart||!sel)return best();return sel}
function render(){
 const b=best(),ch=chosen();
 $('subs').innerHTML=SUBS.map((g,gi)=>'<div class="sg'+(shut[gi]?' shut':'')+'"><button class="sh" data-g="'+gi+'"><div class="tx"><b>'+g.n+'</b><span>'+g.s.length+' '+(g.s.length>4?'серверов':'сервера')+' · '+g.u+'</span></div><svg viewBox="0 0 24 24"><use href="#i-chev"/></svg></button><div class="sv">'+
  g.s.map((s,si)=>'<button class="srv'+(ch.gi===gi&&ch.si===si?' sel':'')+(b.gi===gi&&b.si===si?' best':'')+'" data-g="'+gi+'" data-s="'+si+'"><span class="cc">'+s.c+'</span><span class="nm"><b>'+s.n+'</b><span>'+s.l+'</span></span><span class="pg">'+s.p+' мс</span><svg class="ck" viewBox="0 0 24 24"><use href="#i-ck"/></svg></button>').join('')+'</div></div>').join('');
 $('sw').classList.toggle('on',smart);
 text();
}
function text(){
 const ch=chosen(),n=ch.s.n;
 $('st').textContent={off:'Отключено',con:'Подключение…',on:'Подключено'}[state];
 $('sub2').textContent=state==='off'?(smart?'Умное подключение: '+n:n):state==='con'?n:n+' · '+ch.s.p+' мс';
}
function setS(s){state=s;$('pw').dataset.s=s;text()}
let tm=0;
$('pbtn').addEventListener('click',()=>{
 clearTimeout(tm);
 if(state==='off'){setS('con');tm=setTimeout(()=>setS('on'),2200)}
 else setS('off');
});
$('sw').addEventListener('click',()=>{smart=!smart;if(!smart&&!sel)sel=best();render()});
$('subs').addEventListener('click',e=>{
 const s=e.target.closest('.srv'),h=e.target.closest('.sh');
 if(s){sel={s:SUBS[+s.dataset.g].s[+s.dataset.s],gi:+s.dataset.g,si:+s.dataset.s};smart=false;render();
  if(state==='on'){setS('con');clearTimeout(tm);tm=setTimeout(()=>setS('on'),1600)}}
 else if(h){const g=+h.dataset.g;shut[g]=!shut[g];render()}
});
/* слева: скачать журнал (в прототипе — пример файла) */
$('logs').addEventListener('click',()=>{const b=new Blob(['letnievpn — журнал (пример)\n'],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='letnievpn-log.txt';document.body.appendChild(a);a.click();a.remove()});
/* «+»: молча берёт подписку из буфера обмена, без сообщений и всплывашек */
$('add').addEventListener('click',async()=>{
 let t='';try{t=(await navigator.clipboard.readText()||'').trim()}catch(e){}
 let name='Новая подписка';
 try{name=new URL(t).hostname.replace(/^www\./,'')}catch(e){name=t&&t.length<24?t:'Подписка '+(SUBS.length+1)}
 const seeds=POOL.slice().sort(()=>Math.random()-.5).slice(0,4);
 SUBS.unshift({n:name,u:'без ограничений',s:seeds.map(x=>Object.assign({p:18+Math.round(Math.random()*90)},x)).sort((a,b)=>a.p-b.p)});
 sel=sel?{s:sel.s,gi:sel.gi+1,si:sel.si}:null;shut={};render();
 $('scroll').scrollTo({top:0});
});
/* смена темы: волна расходится кругом от иконки */
function applyTheme(){const l=$('scr').classList.toggle('light');document.body.classList.toggle('dk',!l);
 const c=l?'#D4527F':'#F4A6C0';$('themeBtn').style.setProperty('--pk',c);$('shotBtn').style.setProperty('--pk',c)}
$('themeBtn').addEventListener('click',()=>{
 if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches){applyTheme();return}
 const r=$('themeBtn').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 const end=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 const t=document.startViewTransition(applyTheme);
 t.ready.then(()=>document.documentElement.animate(
  {clipPath:['circle(0px at '+x+'px '+y+'px)','circle('+end+'px at '+x+'px '+y+'px)']},
  {duration:750,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
});
render();
function fit(){const k=Math.min(1,(innerHeight-24)/887,(innerWidth-24)/408);$('stage').style.transform='scale('+k+')'}
fit();addEventListener('resize',fit);

/* Скачать скрин: PNG 1080×2400, только экран */
(function(){
const btn=$('shotBtn'),lab=btn.querySelector('span');
let d=null,moved=false;
btn.addEventListener('pointerdown',e=>{const r=btn.getBoundingClientRect();d={x:e.clientX,y:e.clientY,l:r.left,t:r.top};moved=false;btn.setPointerCapture(e.pointerId)});
btn.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;
 btn.style.left=Math.min(Math.max(4,d.l+dx),innerWidth-btn.offsetWidth-4)+'px';btn.style.top=Math.min(Math.max(4,d.t+dy),innerHeight-btn.offsetHeight-4)+'px';btn.style.right='auto';btn.style.bottom='auto'});
btn.addEventListener('pointerup',()=>{d=null});btn.addEventListener('pointercancel',()=>{d=null});
btn.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();e.preventDefault();moved=false}},true);
async function shot(){
 const scr=document.querySelector('.screen'),W=scr.offsetWidth,H=Math.round(W*2400/1080),X=new XMLSerializer();
 const cl=scr.cloneNode(true);
 cl.querySelectorAll('.status').forEach(e=>e.remove());
 cl.querySelectorAll('use').forEach(u=>{const sym=document.querySelector(u.getAttribute('href')),sv=u.parentNode;if(!sym)return;sv.setAttribute('viewBox',sym.getAttribute('viewBox'));sv.removeChild(u);[...sym.children].forEach(ch=>sv.appendChild(ch.cloneNode(true)))});
 cl.style.cssText='width:'+W+'px;height:'+H+'px;border-radius:0;font-family:'+getComputedStyle(document.body).fontFamily.replace(/"/g,"'")+';color:var(--text)';
 const so=scr.querySelectorAll('.scroll'),sc=cl.querySelectorAll('.scroll');
 so.forEach((e,i)=>{const t=e.scrollTop;if(!t)return;const w=document.createElement('div');w.style.cssText='transform:translateY('+(-t)+'px)';while(sc[i].firstChild)w.appendChild(sc[i].firstChild);sc[i].appendChild(w);sc[i].style.overflow='hidden'});
 const st=document.createElement('style');st.textContent=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'+X.serializeToString(st)+X.serializeToString(cl)+'</foreignObject></svg>';
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 const c=document.createElement('canvas');c.width=1080;c.height=2400;
 const x=c.getContext('2d');x.imageSmoothingQuality='high';x.fillStyle=getComputedStyle(scr).getPropertyValue('--bg').trim()||'#141012';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='letnievpn-'+c.width+'x'+c.height+'.png';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
btn.addEventListener('click',async()=>{
 if(btn.disabled)return;btn.disabled=true;lab.textContent='Готовлю…';
 try{await shot();lab.textContent='Готово'}catch(e){console.error(e);lab.textContent='Не вышло'}
 setTimeout(()=>{lab.textContent='Скачать скрин';btn.disabled=false},1600);
});
})();
</script>
</body></html>
